<div class="form-row cols-2">
    <label>Enter your full name [text* full-name]</label>
    <label>Postcode [text* postcode]</label>
</div>
<div class="form-row cols-2">
    <label>Housenumber [text* house-number]</label>
    <label>Addition [text* addition]</label>
</div>
<div class="form-row cols-2">
    <label>City [text* city]</label>
    <label>Country [text* country]</label>
</div>
<div class="form-row cols-2">
    <label>Email [email* email]</label>
    <label>Enter your contact number [tel* phone]</label>
</div>

<label>How can we help you? [textarea* message]</label>

[submit "Submit"]
